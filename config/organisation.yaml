# =====================================================================
# GUDA — Organisation configuration for synthetic data generation
# DISCLAIMER: The Global Urban Development Alliance (GUDA) is a FICTIONAL
# organisation. All records generated from this file are synthetic.
# This is an independent portfolio project, not an official UN system.
# =====================================================================

organisation:
  name: Global Urban Development Alliance
  short_name: GUDA
  headquarters: Nairobi

generation:
  random_seed: 42              # same seed = identical data every run (reproducibility)
  total_employees: 3000
  total_recruitments: 1000
  first_reporting_month: "2024-11"
  last_reporting_month: "2026-10"   # 24 monthly snapshots

# ---------------------------------------------------------------------
# Offices. Each has its own "submission habits", which is where the
# data-quality problems come from.
#   headcount_weight : share of workforce (weights sum to 100)
#   file_format      : how the office submits files
#   date_format      : the office's local date convention
#   column_style     : how the office names its columns
#   error_rate_start / error_rate_end : share of records with problems at
#                      the start vs the end of the period (simulates the
#                      effect of data-quality training over time)
# ---------------------------------------------------------------------
offices:
  - office_id: OFF01
    office_name: Nairobi Headquarters
    country: Kenya
    region: Africa
    city: Nairobi
    office_type: Headquarters
    headcount_weight: 25
    file_format: csv
    date_format: "%Y-%m-%d"
    column_style: snake_case
    error_rate_start: 0.04
    error_rate_end: 0.02

  - office_id: OFF02
    office_name: Addis Ababa Regional Office
    country: Ethiopia
    region: Africa
    city: Addis Ababa
    office_type: Regional Office
    headcount_weight: 10
    file_format: xlsx
    date_format: "%d/%m/%Y"
    column_style: title_case
    error_rate_start: 0.10
    error_rate_end: 0.05

  - office_id: OFF03
    office_name: Dakar Regional Office
    country: Senegal
    region: Africa
    city: Dakar
    office_type: Regional Office
    headcount_weight: 8
    file_format: csv
    date_format: "%d/%m/%Y"
    column_style: title_case
    error_rate_start: 0.12
    error_rate_end: 0.07

  - office_id: OFF04
    office_name: Johannesburg Country Office
    country: South Africa
    region: Africa
    city: Johannesburg
    office_type: Country Office
    headcount_weight: 7
    file_format: xlsx
    date_format: "%Y/%m/%d"
    column_style: snake_case
    error_rate_start: 0.06
    error_rate_end: 0.03

  - office_id: OFF05
    office_name: Geneva Liaison Office
    country: Switzerland
    region: Europe
    city: Geneva
    office_type: Liaison Office
    headcount_weight: 8
    file_format: xlsx
    date_format: "%d.%m.%Y"
    column_style: title_case
    error_rate_start: 0.03
    error_rate_end: 0.02

  - office_id: OFF06
    office_name: Bangkok Regional Office
    country: Thailand
    region: Asia-Pacific
    city: Bangkok
    office_type: Regional Office
    headcount_weight: 10
    file_format: csv
    date_format: "%d-%b-%Y"
    column_style: abbreviated
    error_rate_start: 0.09
    error_rate_end: 0.04

  - office_id: OFF07
    office_name: Dhaka Country Office
    country: Bangladesh
    region: Asia-Pacific
    city: Dhaka
    office_type: Country Office
    headcount_weight: 8
    file_format: xlsx
    date_format: "%d/%m/%Y"
    column_style: abbreviated
    error_rate_start: 0.15
    error_rate_end: 0.08

  - office_id: OFF08
    office_name: Amman Regional Office
    country: Jordan
    region: Middle East
    city: Amman
    office_type: Regional Office
    headcount_weight: 8
    file_format: csv
    date_format: "%d/%m/%Y"
    column_style: snake_case
    error_rate_start: 0.08
    error_rate_end: 0.05

  - office_id: OFF09
    office_name: Panama City Regional Office
    country: Panama
    region: Latin America and Caribbean
    city: Panama City
    office_type: Regional Office
    headcount_weight: 9
    file_format: xlsx
    date_format: "%m/%d/%Y"      # month-first: the classic ambiguity trap
    column_style: title_case
    error_rate_start: 0.11
    error_rate_end: 0.06

  - office_id: OFF10
    office_name: Kinshasa Country Office
    country: Democratic Republic of the Congo
